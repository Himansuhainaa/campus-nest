name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes older runs irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 = minimum realistic host runtime, 22 = what Render/Vercel default to.
        node: [20, 22]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # The suite refuses to run unless this database name ends in "_test",
          # because it calls dropDatabase() on teardown.
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/campusnest_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-real

      - name: Verify the seed script runs against a clean database
        run: npm run seed
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/campusnest_seedcheck
          JWT_SECRET: ci-only-secret-not-used-anywhere-real

  client:
    name: Client build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Only baked into the bundle so the build has something to resolve;
          # the real value is set in the hosting platform's environment.
          VITE_API_URL: http://localhost:5000/api
