# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New > Blueprint > pick this repo. It reads this file and creates the
# API service pre-configured. You are only asked for the two secrets marked
# `sync: false`; JWT_SECRET is generated by Render so nobody ever handles it.

services:
  - type: web
    name: campus-nest-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    # Pinned so production runs the same major CI tests against. Without this,
    # `engines: >=20` lets Render pick the newest Node in existence — it was
    # running 26 while CI only ever tested 20 and 22. See server/.node-version.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Render generates a long random value and stores it. Never shown in the repo.
      - key: JWT_SECRET
        generateValue: true

      # Prompted for on first deploy: your MongoDB Atlas connection string,
      # e.g. mongodb+srv://USER:PASS@cluster0.xxxxx.mongodb.net/campusnest?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false

      # Prompted for on first deploy. Set to your deployed frontend origin, no
      # trailing slash, e.g. https://campus-nest.vercel.app
      # Leave blank on the very first deploy, then fill it in once Vercel gives
      # you a URL and redeploy.
      - key: CLIENT_ORIGIN
        sync: false

      # Strongly recommended in production. Without it, uploaded photos are
      # written to Render's ephemeral disk and vanish on every restart or
      # redeploy. Copy the "API environment variable" from your Cloudinary
      # dashboard: cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false

    # PORT is injected by Render automatically — do not set it here.
